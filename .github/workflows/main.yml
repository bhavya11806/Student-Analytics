
name: Student Analytics CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Student Analytics Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: student-analytics:latest
    
  deploy:
    name: Deploy to EC2
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Application
        run: |
          cd ~/Student-Analytics
          git checkout main
          git pull origin main
          sudo docker build -t student-analytics .
          sudo docker stop student-analytics-app || true
          sudo docker rm student-analytics-app || true
          sudo docker run -d -p 80:5000 --env-file .env --name student-analytics-app student-analytics

